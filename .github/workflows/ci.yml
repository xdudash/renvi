name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: TypeScript, lint, web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: scripts/ci-annotate.sh TypeScript npx tsc --noEmit --pretty false
      - name: Lint
        if: ${{ !cancelled() }}
        run: scripts/ci-annotate.sh Lint npx expo lint
      - name: i18n keys
        if: ${{ !cancelled() }}
        run: scripts/ci-annotate.sh i18n node scripts/check-i18n.mjs
      - name: Client logic checks
        if: ${{ !cancelled() }}
        run: scripts/ci-annotate.sh client node scripts/check-client.mjs
      - name: App Store release gate
        if: ${{ !cancelled() }}
        run: scripts/ci-annotate.sh release node scripts/check-release.mjs
      - name: Identity and feature logic checks
        if: ${{ !cancelled() }}
        run: node scripts/check-identity.mjs && node --test scripts/tests/*.test.mjs
      - name: Production web bundle
        if: ${{ !cancelled() }}
        run: npx expo export --platform web

  db:
    name: Database migrations and behaviour tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: oven-sh/setup-bun@v2
      - name: Migrations and tests
        run: bash scripts/test-db.sh
